<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உழவன் தோழன் - விவசாய அரட்டை</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <!-- Link your custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- Assuming style.css -->

</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h5>விவசாய அரட்டை உதவி</h5>
            <a href="{{ url_for('home') }}" class="btn btn-sm btn-outline-light home-link">முகப்பு</a>
        </div>
        <div class="chat-log" id="chat-log">
            <!-- Chat messages will appear here -->
        </div>

        <!-- Container for response options/buttons -->
        <div class="chat-options" id="chat-options">
            <!-- Buttons will be added here by JavaScript -->
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator-chat" class="loading-indicator" style="display: none;">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span>பதிலளிக்கிறேன்...</span>
        </div>


        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="இங்கே தட்டச்சு செய்யவும் (அல்லது மேலே உள்ள பொத்தானைத் தேர்ந்தெடுக்கவும்)" class="form-control">
            <button id="chat-send-btn" class="btn btn-primary">அனுப்பு</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Link your custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
