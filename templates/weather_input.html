<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உழவன் தோழன் - வானிலை பயிர் உள்ளீடு</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Tamil', 'Poppins', sans-serif; background-color: #f0f4f0; }
        .input-container { max-width: 700px; margin: 50px auto; padding: 35px 40px; background-color: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-top: 5px solid #0d6efd; } /* Blue accent */
        .input-container h2 { color: #0a58ca; font-weight: 700; }
        .form-label { font-weight: 700; color: #495057; }
        .btn-suggest { font-weight: 600; padding: 0.75rem 1.5rem; font-size: 1.1rem; }
         .alert-flash { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-container">
            <h2 class="text-center mb-3">வானிலை அடிப்படையில் பயிர் பரிந்துரை</h2>
            <p class="text-center text-muted mb-4">உங்கள் மண் வகை, நடவு மாதம் மற்றும் மாவட்டத்தைத் தேர்ந்தெடுக்கவும்.</p>

            <!-- Flash Messages Area -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category else 'info' }} alert-dismissible fade show alert-flash" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Form submits to the /weather_results endpoint -->
            <form action="{{ url_for('weather_results') }}" method="post">
                <div class="row g-3 mb-3">
                    <!-- Soil Type Dropdown -->
                     <div class="col-md-4">
                         <label for="soil-type-select" class="form-label">மண் வகை:</label>
                         <select class="form-select" id="soil-type-select" name="soil_type" required> <!-- Added name attribute -->
                             <option selected disabled value="">-- தேர்ந்தெடுக்கவும் --</option>
                             <option value="Alluvial">நதிக் கரை மண் (Alluvial)</option>
                             <option value="Black">கரும்பசுமண் (Black)</option>
                             <option value="Clay"> களிமண் மண் (Clay)</option>
                             <option value="Desert"> பாலைவன மண் (Desert)</option>
                             <option value="Laterite"> சுண்ணாம்பு உப்பு மண் (Laterite)</option>
                             <option value="Loamy"> மணல்வெட்டி மண் (Loamy)</option>
                             <option value="Peaty"> பழுப்பு மண் (Peaty)</option>
                             <option value="Red"> சிவப்பு மண் (Red)</option>
                             <option value="Saline"> உப்புமண் (Saline)</option>
                             <option value="Sandy"> மணல்வெளி மண்  (Sandy)</option>
                         </select>
                    </div>
                    <!-- Planting Month Input -->
                    <div class="col-md-4">
                        <label for="start-month-input" class="form-label">நடவு மாதம்:</label>
                        <input type="month" class="form-control" id="start-month-input" name="start_month" required> <!-- Added name attribute -->
                    </div>
                    <!-- District Dropdown -->
                    <div class="col-md-4">
                        <label for="location-select" class="form-label">மாவட்டம்:</label>
                        <select class="form-select" id="location-select" name="location" required> <!-- Added name attribute -->
                            <option selected disabled value="">-- தேர்ந்தெடுக்கவும் --</option>
                            <option value="Ariyalur">அரியலூர் (Ariyalur)</option>
                            <option value="Chengalpattu">செங்கல்பட்டு (Chengalpattu)</option>
                            <option value="Chennai">சென்னை (Chennai)</option>
                            <option value="Coimbatore">கோயம்புத்தூர் (Coimbatore)</option>
                            <option value="Cuddalore">கடலூர் (Cuddalore)</option>
                            <option value="Dharmapuri">தர்மபுரி (Dharmapuri)</option>
                            <option value="Dindigul">திண்டுக்கல் (Dindigul)</option>
                            <option value="Erode">ஈரோடு (Erode)</option>
                            <option value="Kallakurichi">கள்ளக்குறிச்சி (Kallakurichi)</option>
                            <option value="Kanchipuram">காஞ்சிபுரம் (Kanchipuram)</option>
                            <option value="Kanyakumari">கன்னியாகுமரி (Kanyakumari)</option>
                            <option value="Karur">கரூர் (Karur)</option>
                            <option value="Krishnagiri">கிருஷ்ணகிரி (Krishnagiri)</option>
                            <option value="Madurai">மதுரை (Madurai)</option>
                            <option value="Mayiladuthurai">மயிலாடுதுறை (Mayiladuthurai)</option>
                            <option value="Nagapattinam">நாகப்பட்டினம் (Nagapattinam)</option>
                            <option value="Namakkal">நாமக்கல் (Namakkal)</option>
                            <option value="Nilgiris">நீலகிரி (Nilgiris)</option>
                            <option value="Perambalur">பெரம்பலூர் (Perambalur)</option>
                            <option value="Pudukkottai">புதுக்கோட்டை (Pudukkottai)</option>
                            <option value="Ramanathapuram">இராமநாதபுரம் (Ramanathapuram)</option>
                            <option value="Ranipet">இராணிப்பேட்டை (Ranipet)</option>
                            <option value="Salem">சேலம் (Salem)</option>
                            <option value="Sivaganga">சிவகங்கை (Sivaganga)</option>
                            <option value="Tenkasi">தென்காசி (Tenkasi)</option>
                            <option value="Thanjavur">தஞ்சாவூர் (Thanjavur)</option>
                            <option value="Theni">தேனி (Theni)</option>
                            <option value="Thoothukudi">தூத்துக்குடி (Thoothukudi)</option>
                            <option value="Tiruchirappalli">திருச்சிராப்பள்ளி (Tiruchirappalli)</option>
                            <option value="Tirunelveli">திருநெல்வேலி (Tirunelveli)</option>
                            <option value="Tirupathur">திருப்பத்தூர் (Tirupathur)</option>
                            <option value="Tiruppur">திருப்பூர் (Tiruppur)</option>
                            <option value="Tiruvallur">திருவள்ளூர் (Tiruvallur)</option>
                            <option value="Tiruvannamalai">திருவண்ணாமலை (Tiruvannamalai)</option>
                            <option value="Tiruvarur">திருவாரூர் (Tiruvarur)</option>
                            <option value="Vellore">வேலூர் (Vellore)</option>
                            <option value="Viluppuram">விழுப்புரம் (Viluppuram)</option>
                            <option value="Virudhunagar">விருதுநகர் (Virudhunagar)</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg btn-suggest">பயிர்களை பரிந்துரை செய்</button>
                </div>
            </form>

             <div class="text-center mt-3">
                 <a href="{{ url_for('home') }}" class="btn btn-link btn-sm">முகப்புக்குச் செல்</a> <!-- Back to Home -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
